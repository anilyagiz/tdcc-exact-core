[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tdcc-exact-core"
version = "0.1.0"
description = "TDCC Exact Core: an auditable AI accelerator (built on openTPU) whose every answer anyone can re-check"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The Decentralized Compute Company" }]
keywords = ["verifiable-compute", "ai-accelerator", "fpga", "tpu", "solana", "fraud-proof"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = ["numpy", "textual"]

[project.urls]
Homepage = "https://github.com/anilyagiz/tdcc-exact-core"
Repository = "https://github.com/anilyagiz/tdcc-exact-core"
Issues = "https://github.com/anilyagiz/tdcc-exact-core/issues"
Upstream = "https://github.com/FeSens/openTPU"

[project.optional-dependencies]
chain = ["solders>=0.21"]
# real checkpoints (models/LFM2.5-230M): the tokenizer's chat template, the safetensors reader
model = ["transformers", "jinja2", "huggingface_hub", "safetensors", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
tdcc-exact = "tdcc_exact.cli:main"
otpu-lens = "opentpu.host.hwlens:main"
otpu-smi = "opentpu.host.smi:main"
otpu-lock = "opentpu.host.runstate:hold_main"
otpu-selftest = "opentpu.host.selftest:main"
otpu-diag = "opentpu.host.diag:main"
otpu-chat = "opentpu.host.chat:main"
otpu-setup = "opentpu.host.pcie_setup:main"
otpu-i2c = "opentpu.host.i2c:main"
otpu-memcal = "opentpu.host.memcal:main"

[tool.setuptools.packages.find]
include = ["opentpu*", "tdcc_exact*"]

[tool.setuptools.package-data]
tdcc_exact = ["models.json", "py.typed"]
opentpu = ["lens_app.html", "host/setup_pcie.sh", "host/pcie/*", "host/litedram/*"]

# Lint for TDCC Exact's own Python only (upstream openTPU code is not linted here): the rule set
# is the one the current code passes. Left out for now: I (import order: chain.py, cli.py,
# oracle.py, trace.py, test_exact.py), E741 (`l` in chain.py), and B905/B008/B007 (zip without
# strict=, Params() as a default in chain.py, an unused loop variable in chain_demo.py).
# Not linted yet: tools/oracle_eval.py (B023, a closure over the loop variable `fmt`).
[tool.ruff]
line-length = 120
target-version = "py310"
include = [
    "tdcc_exact/**/*.py",
    "tools/record_demo.py",
    "tests/test_exact.py",
    "tests/test_chain.py",
    "tests/test_api.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E741", "B905", "B008", "B007"]

[tool.ruff.lint.per-file-ignores]
# the recorded demo's script: each line is one README command, kept whole
"tools/record_demo.py" = ["E501"]
