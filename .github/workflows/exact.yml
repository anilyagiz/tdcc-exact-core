name: exact

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . pytest
      - run: python -m pytest -q tests/test_exact.py tests/test_isa.py tests/test_compiler.py
      - name: the demo still runs end to end
        run: tdcc-exact demo
