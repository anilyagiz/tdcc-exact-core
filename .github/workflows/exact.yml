name: exact

# every push is checked (work happens on branches before it has a pull request); a pull request
# from a fork is checked through pull_request. A PR from a branch in this repository runs for
# both events, and the concurrency group below keeps that to one run per ref.
on:
  push:
  pull_request:
  workflow_dispatch:

# a newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read      # CI only reads the code; a public repo's runs get no write token

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # the files and rules are in pyproject.toml's [tool.ruff]
      - run: ruff check

  # the program's Rust: formatting and clippy (host build, no Solana toolchain needed);
  # clippy passes on programs/tdcc_exact, so its warnings fail the job
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('programs/**', 'Cargo.lock', 'Cargo.toml') }}
          restore-keys: rust-lint-${{ runner.os }}-
      # advisory until lib.rs is formatted (one require! in challenge is not rustfmt's layout);
      # drop continue-on-error once `cargo fmt --all` has been run on it
      - run: cargo fmt --all --check
        continue-on-error: true
      - run: cargo clippy -p tdcc_exact --all-targets -- -D warnings

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest
      - run: python -m pytest -q tests/test_exact.py tests/test_api.py tests/test_isa.py tests/test_compiler.py
      - name: the demo still runs end to end
        run: tdcc-exact demo
      - name: the README's step-by-step commands
        working-directory: ${{ runner.temp }}
        run: |
          set -x
          tdcc-exact job new --model tiny --question "Will it rain tomorrow?" --id j1 --out job.json
          tdcc-exact run --job job.json --provider A --out a.json --trace a.trace.json
          tdcc-exact run --job job.json --provider B --skip-layer 1 --out b.json --trace b.trace.json
          tdcc-exact verify --job job.json --receipt a.json
          ! tdcc-exact verify --job job.json --receipt b.json
          tdcc-exact verify --job job.json --receipt b.json --json | python -c \
            "import json, sys; assert json.load(sys.stdin)['verdict'] == 'CHALLENGE'"
          tdcc-exact dispute --job job.json --trace b.trace.json --receipt b.json \
            --replay-skip-layer 1 | grep 'first fault: step'
          # a trace other than the posted one loses the dispute at once
          tdcc-exact dispute --job job.json --trace a.trace.json --receipt b.json \
            | grep 'does not match the posted trace root'

  # the verifier on the renter's own machine: no board, no Linux. tests/conftest.py imports
  # opentpu.rtlsim (fcntl), so the verifier's tests run without it (--noconftest)
  verifier:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e . pytest
      - run: python -m pytest -q --noconftest tests/test_exact.py tests/test_api.py
      - name: the demo still runs end to end
        run: tdcc-exact demo

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # pinned: the version the program builds with and the chain tests pass on
      AGAVE_VERSION: v4.3.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cache/solana
            target
          # the sources and the toolchain are in the key, so a stale target/ (and its .so)
          # cannot outlive a change to either
          key: program-${{ runner.os }}-${{ env.AGAVE_VERSION }}-${{ hashFiles('programs/**', 'Cargo.lock', 'Cargo.toml') }}
      - name: Solana CLI (Agave ${{ env.AGAVE_VERSION }})
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: program unit tests (settlement vectors, commitment)
        run: cargo test -p tdcc_exact
      - name: build the program
        run: cargo build-sbf --manifest-path programs/tdcc_exact/Cargo.toml
      - run: pip install -e '.[chain]' pytest
      - name: the program on a local validator
        run: |
          solana-test-validator --reset --quiet --ledger /tmp/ledger \
            --bpf-program HzpKeqHLg7Mmjh1JmGymef7Z7hf3JXhaagp6UgTSH24A \
            target/deploy/tdcc_exact.so &
          up=
          for i in $(seq 60); do
            if solana -ul cluster-version; then up=1; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error::solana-test-validator did not answer on localhost within 60 s"
            exit 1
          fi
          TDCC_EXACT_REQUIRE_CHAIN=1 python -m pytest -q tests/test_chain.py
          TDCC_EXACT_KEYS=/tmp/keys tdcc-exact demo --localnet --commit-window 60 --challenge-window 30
