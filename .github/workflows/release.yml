name: release

# a v* tag publishes a GitHub release; a manual run makes a draft release for the tag it is given
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag (e.g. v0.1.0); created at the selected ref if it does not exist"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  AGAVE_VERSION: v4.3.0

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject.toml's version $v"
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - name: the wheel installs and runs
        run: |
          python -m venv /tmp/w
          /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/python -c "import tdcc_exact; print(tdcc_exact.__version__)"
          /tmp/w/bin/tdcc-exact demo
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  program:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Solana CLI (Agave ${{ env.AGAVE_VERSION }})
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      # a clean build (no cache): the released .so comes from these sources alone
      - run: cargo build-sbf --manifest-path programs/tdcc_exact/Cargo.toml
      - name: checksum
        run: |
          cd target/deploy
          sha256sum tdcc_exact.so > tdcc_exact.so.sha256
          cat tdcc_exact.so.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: |
            target/deploy/tdcc_exact.so
            target/deploy/tdcc_exact.so.sha256
          if-no-files-found: error

  release:
    needs: [python, program]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          draft=
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then draft=--draft; fi
          gh release create "$TAG" $draft --target "$GITHUB_SHA" --generate-notes \
            --title "TDCC Exact $TAG" out/*
      # PyPI: not published (the owner's decision). To publish later, add a job with
      # `environment: pypi` and `permissions: id-token: write` (trusted publishing) that
      # downloads python-dist and runs:
      # - uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: dist/
